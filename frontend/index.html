<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050d1a" />
    <meta
      name="description"
      content="WeatherGPT — conversational, multilingual weather intelligence that turns forecast data into plain-language, actionable guidance."
    />
    <title>WeatherGPT — Weather Intelligence Assistant</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Latin display/body plus Noto Indic subsets: without these the Devanagari,
         Telugu, Bengali and Assamese answers fall back to whatever the OS has,
         which on many machines renders with broken conjuncts. -->
    <!-- Loaded non-render-blocking: on a slow or filtered network a stalled
         font stylesheet would otherwise hold up first paint. The CSS stack has
         real fallbacks, so the app is legible before the webfonts arrive. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans+Bengali:wght@400;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <!-- Puter.js gives the browser its own speech-to-text (puter.ai.speech2txt).
         It runs client-side with no API key, so voice input keeps working on a
         machine where the server has no transcription configured at all, and in
         browsers that lack the Web Speech API. Loaded async and entirely
         optional: useVoiceRecorder feature-detects it and falls back if the
         script never arrives. -->
    <script async src="https://js.puter.com/v2/"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
